<style>
  :root {
    --papyrus:       #f1e4c6;
    --papyrus-soft:  #c9b894;
    --papyrus-dim:   #9a8b6d;
    --ink:           #1b2a3d;
    --ink-elevated:  #243449;
    --ink-raised:    #2d3f57;
    --gold:          #c9a646;
    --gold-dark:     #a0801e;
    --gold-light:    #e8c866;
    --terracotta-lt: #d97a5c;
  }

  /* ========== TEMA CLARO ========== */
  :root[data-theme="light"] {
    --papyrus:       #0d0a06;
    --papyrus-soft:  #271e11;
    --papyrus-dim:   #3d2e1e;
    --papyrus-dark:  #120d08;
    --ink:           #fdf8ee;
    --ink-elevated:  #f5ecd8;
    --ink-raised:    #eaddb8;
    --ink-soft:      #dfd0a0;
    --gold:          #5c480e;
    --gold-dark:     #42340a;
    --gold-light:    #7a5e14;
    --terracotta:    #6e1e0d;
    --terracotta-lt: #8a2b18;
    --terracotta-dk: #4e1508;
    --shadow:        rgba(29, 53, 87, 0.20);
  }

  html[data-theme="light"],
  html[data-theme="light"] body {
    background:
      linear-gradient(rgba(245, 237, 216, 0.72), rgba(232, 220, 192, 0.78)),
      url('assets/images/pexels-clioseye-35506459.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--papyrus);
  }

  html[data-theme="light"] body::before {
    opacity: 0.25;
    mix-blend-mode: multiply;
  }

  html[data-theme="light"] .about-btn,
  html[data-theme="light"] .lang-toggle {
    background: rgba(29, 53, 87, 0.08);
  }

  html[data-theme="light"] .scroll-card {
    background: linear-gradient(180deg, rgba(255,252,246,0.90), rgba(248,242,226,0.85));
  }

  html[data-theme="light"] .scroll-card.locked {
    background: rgba(245, 237, 216, 0.70);
  }

  html[data-theme="light"] .modal-panel {
    background: linear-gradient(180deg, #f5edd8 0%, #ede3c8 100%);
  }

  html[data-theme="light"] .modal-close {
    background: rgba(29, 53, 87, 0.08);
  }

  .btn-theme {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    background: rgba(27, 42, 61, 0.5);
    border: 1.5px solid var(--gold-dark);
    color: var(--gold);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    backdrop-filter: blur(4px);
  }
  .btn-theme:hover {
    color: var(--gold-light);
    border-color: var(--gold);
  }
  .btn-theme:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  html[data-theme="light"] .btn-theme {
    background: rgba(29, 53, 87, 0.08);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    font-family: 'EB Garamond', 'Gentium Plus', 'Noto Serif', Georgia, serif;
    color: var(--papyrus);
    background:
      linear-gradient(rgba(20, 32, 47, 0.85), rgba(27, 42, 61, 0.85)),
      url('assets/images/pexels-clioseye-35506459.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    line-height: 1.6;
  }

  /* iOS Safari não suporta background-attachment: fixed e pode esticar a foto */
  @media (hover: none), (pointer: coarse) {
    html, body,
    html[data-theme="light"],
    html[data-theme="light"] body {
      background-attachment: scroll;
    }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 15% 22%, rgba(201, 166, 70, 0.08) 0 2px, transparent 3px),
      radial-gradient(circle at 78% 45%, rgba(201, 166, 70, 0.06) 0 2px, transparent 3px),
      radial-gradient(circle at 32% 78%, rgba(201, 166, 70, 0.09) 0 3px, transparent 4px),
      radial-gradient(circle at 88% 88%, rgba(201, 166, 70, 0.05) 0 2px, transparent 3px),
      radial-gradient(circle at 55% 15%, rgba(201, 166, 70, 0.07) 0 2px, transparent 3px);
    background-size: 340px 340px;
    opacity: 0.6;
    mix-blend-mode: screen;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 20px 40px;
    text-align: center;
    animation: fadein 1s ease;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    gap: 12px;
    flex-wrap: wrap;
  }
  
  .about-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.15em;
    background: rgba(27, 42, 61, 0.5);
    border: 1.5px solid var(--gold-dark);
    color: var(--papyrus-soft);
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease;
    text-transform: uppercase;
    backdrop-filter: blur(4px);
  }
  .about-btn:hover {
    color: var(--gold-light);
    border-color: var(--gold);
  }
  .about-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  .about-btn .info-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    font-size: 10px;
    font-family: 'EB Garamond', 'Gentium Plus', 'Noto Serif', serif;
    font-weight: 700;
    font-style: italic;
    line-height: 1;
  }
  
  .lang-toggle {
    display: inline-flex;
    border: 1.5px solid var(--gold-dark);
    border-radius: 999px;
    overflow: hidden;
    background: rgba(27, 42, 61, 0.5);
    backdrop-filter: blur(4px);
  }
  .lang-toggle button {
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.15em;
    background: transparent;
    border: none;
    color: var(--papyrus-soft);
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .lang-toggle button.active {
    background: var(--gold);
    color: var(--ink);
  }
  .lang-toggle button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
    position: relative;
    z-index: 1;
  }

  .page-header {
    animation: fadein 1s ease 0.1s backwards;
  }

  h1 { font-family: 'Cinzel', 'Gentium Plus', serif; font-size: clamp(36px, 5vw, 56px); color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .subtitle { font-family: 'Cinzel', 'Gentium Plus', serif; color: var(--terracotta-lt); letter-spacing: 0.3em; font-size: 14px; margin-bottom: 24px; text-transform: uppercase; }

  /* ===== Abas (Início · Mapa · Coleção · Certificado) ===== */
  .tabbar {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 auto 38px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(201, 166, 70, 0.15);
    animation: fadein 1s ease 0.15s backwards;
  }
  .tabbar .tab {
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--papyrus-dim);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 16px 10px;
    margin-bottom: -15px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .tabbar .tab:hover { color: var(--gold-light); }
  .tabbar .tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
    text-shadow: 0 0 18px rgba(201, 166, 70, 0.25);
  }
  .tabbar .tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }

  .tab-panel { animation: fadein 0.5s ease; }
  .tab-panel[hidden] { display: none; }

  /* Cabeçalho de cada painel (Mapa / Coleção) */
  .panel-heading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .panel-body { animation: fadein 0.5s ease; }

  /* Como painéis autônomos, não herdam a borda/margem de empilhamento */
  .tab-panel.geo-section,
  .tab-panel.collection-section,
  .tab-panel.certificate-section {
    margin-top: 0;
    border-top: none;
    padding-top: 0;
  }
  .about-beta-note { font-size: 0.82em; color: var(--terracotta-lt); font-style: italic; margin-top: 16px; opacity: 0.8; }
  .modal-cite { margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(201,166,70,0.2); font-size: 0.86em; color: var(--papyrus-soft); line-height: 1.55; }
  .modal-cite .modal-subtitle { margin-top: 0; }
  .modal-cite .cite-ref { font-style: normal; }
  .modal-cite a { color: var(--gold-light); word-break: break-word; }
  .modal-license { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--gold-dark); text-align: center; }
  .modal-license a { opacity: 0.65; transition: opacity 0.2s; display: inline-block; }
  .modal-license a:hover { opacity: 1; }
  .footer-license-badge { display: block; margin-top: 10px; opacity: 0.65; transition: opacity 0.2s; }
  .footer-license-badge:hover { opacity: 1; }

  /* Epígrafe do Ptahhotep */
  .epigraph {
    max-width: 620px;
    margin: 56px auto 0;
    padding: 22px 28px;
    position: relative;
    animation: fadein 1s ease 0.25s backwards;
  }
  .epigraph::before, .epigraph::after {
    content: '';
    display: block;
    width: 60%;
    height: 1px;
    margin: 0 auto;
    background: linear-gradient(90deg, transparent, rgba(201,166,70,0.5), transparent);
  }
  .epigraph::before { margin-bottom: 18px; }
  .epigraph::after { margin-top: 18px; }
  .epigraph-label {
    color: var(--gold);
    font-size: 20px;
    margin-bottom: 14px;
    line-height: 1;
  }
  .epigraph-label .glyphs {
    font-family: 'Noto Sans Egyptian Hieroglyphs', sans-serif;
    letter-spacing: 0.05em;
  }
  .epigraph-label .label-romanized {
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-left: 10px;
    opacity: 0.75;
    vertical-align: middle;
    color: var(--papyrus-soft);
  }
  .epigraph blockquote {
    border: none;
    padding: 0;
    margin: 0;
  }
  .quote-translit {
    font-family: 'EB Garamond', 'Gentium Plus', 'Noto Serif', serif;
    font-style: italic;
    color: var(--gold-light);
    font-size: 16px;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
    line-height: 1.5;
    opacity: 0.9;
  }
  .quote-translation {
    font-family: 'EB Garamond', 'Gentium Plus', 'Noto Serif', serif;
    color: var(--papyrus);
    font-size: 19px;
    line-height: 1.6;
    font-style: italic;
  }
  .epigraph-source {
    display: block;
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--papyrus-dim);
    margin-top: 16px;
  }

  .library-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  
  .scroll-card {
    background: linear-gradient(180deg, rgba(36,52,73,0.7), rgba(27,42,61,0.9));
    border: 1px solid var(--gold-dark);
    border-radius: 12px;
    padding: 30px;
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    text-align: left;
    text-decoration: none;
    display: block;
    backdrop-filter: blur(4px);
    animation: fadein-card 0.7s ease backwards;
  }
  .scroll-card:nth-child(1) { animation-delay: 0.35s; }
  .scroll-card:nth-child(2) { animation-delay: 0.55s; }
  .scroll-card:nth-child(3) { animation-delay: 0.75s; }
  .scroll-card:nth-child(4) { animation-delay: 0.95s; }

  @keyframes fadein-card {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .scroll-card:hover {
    transform: translateY(-4px);
    border-color: var(--gold);
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  }
  .scroll-card:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 4px;
    border-color: var(--gold);
  }
  .scroll-card.locked {
    background: rgba(27,42,61,0.5);
    border-color: rgba(154,139,109,0.3);
    opacity: 0.6;
    cursor: not-allowed;
    pointer-events: none;
  }
  .scroll-card.locked:hover {
    transform: none;
    box-shadow: none;
    border-color: rgba(154,139,109,0.3);
  }
  .scroll-card.more-soon {
    background: transparent;
    border: 1px dashed rgba(201,166,70,0.35);
    cursor: default;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 180px;
  }
  .scroll-card.more-soon:hover {
    transform: none;
    box-shadow: none;
    border-color: rgba(201,166,70,0.35);
  }
  .scroll-card.more-soon .more-glyph {
    font-size: 40px;
    opacity: 0.7;
    margin-bottom: 12px;
  }
  .scroll-card.more-soon .card-title {
    color: var(--gold);
    font-size: 17px;
  }
  .scroll-card.more-soon .card-desc {
    color: var(--papyrus-dim);
  }

  .status-tag {
    position: absolute;
    top: 16px;
    right: 16px;
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
  }
  .tag-ready { background: rgba(201,166,70,0.15); color: var(--gold); border: 1px solid rgba(201,166,70,0.3); }
  .tag-locked { background: rgba(217,122,92,0.1); color: var(--terracotta-lt); border: 1px solid rgba(217,122,92,0.2); }

  .card-glyph { font-family: 'Noto Sans Egyptian Hieroglyphs', sans-serif; font-size: 48px; color: var(--gold); margin-bottom: 16px; line-height: 1; }
  .card-title { font-family: 'Cinzel', 'Gentium Plus', serif; font-size: 20px; font-weight: 700; color: var(--papyrus); margin-bottom: 10px; }
  .card-desc { font-size: 15px; color: var(--papyrus-soft); line-height: 1.5; }

  footer {
    margin-top: 80px;
    padding-top: 20px;
    border-top: 1px solid rgba(201, 166, 70, 0.2);
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--papyrus-dim);
    line-height: 1.6;
    white-space: pre-line;
  }

  /* Logos institucionais (plaquinha clara, legível em ambos os temas) */
  .inst-logos {
    margin: 22px auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .inst-logos-label {
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--papyrus-dim);
    opacity: 0.75;
  }
  .inst-logos-plaque {
    display: inline-flex;
    align-items: center;
    gap: 26px;
    padding: 12px 22px;
    background: #f4ecde;
    border: 1px solid rgba(201, 166, 70, 0.35);
    border-radius: 10px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
  }
  .inst-logos-plaque img {
    display: block;
    width: auto;
    opacity: 0.95;
    transition: opacity 0.2s;
  }
  .inst-logos-plaque img.logo-ppgarq { height: 38px; }
  .inst-logos-plaque img.logo-mn { height: 30px; }
  .inst-logos-plaque a:hover img { opacity: 1; }
  .inst-logos-divider {
    width: 1px;
    align-self: stretch;
    background: rgba(201, 166, 70, 0.4);
  }
  /* No modal, um pouco menores */
  .modal-inst-logos { margin: 16px 0 0; }
  .modal-inst-logos .inst-logos-plaque { gap: 20px; padding: 10px 18px; }
  .modal-inst-logos .inst-logos-plaque img.logo-ppgarq { height: 32px; }
  .modal-inst-logos .inst-logos-plaque img.logo-mn { height: 26px; }
  @media (max-width: 480px) {
    .inst-logos-plaque { gap: 18px; padding: 10px 16px; }
    .inst-logos-plaque img.logo-ppgarq { height: 32px; }
    .inst-logos-plaque img.logo-mn { height: 25px; }
    /* abas mais compactas pra caber as quatro em uma linha */
    .tabbar { gap: 2px; }
    .tabbar .tab { font-size: 11px; letter-spacing: 0.08em; padding: 8px 9px 10px; }
  }

  /* Modal "Sobre o Projeto" */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(8, 14, 22, 0.8);
    backdrop-filter: blur(5px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

        <button class="about-btn" id="certCloseBtn" onclick="hideCertificate()"></button>
