<style>
  :root {
    --papyrus:       #f1e4c6;
    --papyrus-soft:  #c9b894;
    --papyrus-dim:   #9a8b6d;
    --ink:           #1b2a3d;
    --ink-elevated:  #243449;
    --gold:          #c9a646;
    --gold-dark:     #a0801e;
    --gold-light:    #e8c866;
    --terracotta-lt: #d97a5c;
  }

  /* ========== TEMA CLARO ========== */
  :root[data-theme="light"] {
    --papyrus:       #0d0a06;
    --papyrus-soft:  #271e11;
    --papyrus-dim:   #3d2e1e;
    --papyrus-dark:  #120d08;
    --ink:           #fdf8ee;
    --ink-elevated:  #f5ecd8;
    --ink-raised:    #eaddb8;
    --ink-soft:      #dfd0a0;
    --gold:          #5c480e;
    --gold-dark:     #42340a;
    --gold-light:    #7a5e14;
    --terracotta:    #6e1e0d;
    --terracotta-lt: #8a2b18;
    --terracotta-dk: #4e1508;
    --shadow:        rgba(29, 53, 87, 0.20);
  }

  html[data-theme="light"],
  html[data-theme="light"] body {
    background:
      linear-gradient(rgba(245, 237, 216, 0.72), rgba(232, 220, 192, 0.78)),
      url('assets/images/pexels-clioseye-35506459.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--papyrus);
  }

  html[data-theme="light"] body::before {
    opacity: 0.25;
    mix-blend-mode: multiply;
  }

  html[data-theme="light"] .about-btn,
  html[data-theme="light"] .lang-toggle {
    background: rgba(29, 53, 87, 0.08);
  }

  html[data-theme="light"] .scroll-card {
    background: linear-gradient(180deg, rgba(255,252,246,0.90), rgba(248,242,226,0.85));
  }

  html[data-theme="light"] .scroll-card.locked {
    background: rgba(245, 237, 216, 0.70);
  }

  html[data-theme="light"] .modal-panel {
    background: linear-gradient(180deg, #f5edd8 0%, #ede3c8 100%);
  }

  html[data-theme="light"] .modal-close {
    background: rgba(29, 53, 87, 0.08);
  }

  .btn-theme {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    background: rgba(27, 42, 61, 0.5);
    border: 1.5px solid var(--gold-dark);
    color: var(--gold);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    backdrop-filter: blur(4px);
  }
  .btn-theme:hover {
    color: var(--gold-light);
    border-color: var(--gold);
  }
  .btn-theme:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  html[data-theme="light"] .btn-theme {
    background: rgba(29, 53, 87, 0.08);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    font-family: 'EB Garamond', 'Gentium Plus', 'Noto Serif', Georgia, serif;
    color: var(--papyrus);
    background:
      linear-gradient(rgba(20, 32, 47, 0.85), rgba(27, 42, 61, 0.85)),
      url('assets/images/pexels-clioseye-35506459.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    line-height: 1.6;
  }

  /* iOS Safari não suporta background-attachment: fixed e pode esticar a foto */
  @media (hover: none), (pointer: coarse) {
    html, body,
    html[data-theme="light"],
    html[data-theme="light"] body {
      background-attachment: scroll;
    }
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 15% 22%, rgba(201, 166, 70, 0.08) 0 2px, transparent 3px),
      radial-gradient(circle at 78% 45%, rgba(201, 166, 70, 0.06) 0 2px, transparent 3px),
      radial-gradient(circle at 32% 78%, rgba(201, 166, 70, 0.09) 0 3px, transparent 4px),
      radial-gradient(circle at 88% 88%, rgba(201, 166, 70, 0.05) 0 2px, transparent 3px),
      radial-gradient(circle at 55% 15%, rgba(201, 166, 70, 0.07) 0 2px, transparent 3px);
    background-size: 340px 340px;
    opacity: 0.6;
    mix-blend-mode: screen;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 20px 40px;
    text-align: center;
    animation: fadein 1s ease;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    gap: 12px;
    flex-wrap: wrap;
  }
  
  .about-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.15em;
    background: rgba(27, 42, 61, 0.5);
    border: 1.5px solid var(--gold-dark);
    color: var(--papyrus-soft);
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease;
    text-transform: uppercase;
    backdrop-filter: blur(4px);
  }
  .about-btn:hover {
    color: var(--gold-light);
    border-color: var(--gold);
  }
  .about-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  .about-btn .info-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    font-size: 10px;
    font-family: 'EB Garamond', 'Gentium Plus', 'Noto Serif', serif;
    font-weight: 700;
    font-style: italic;
    line-height: 1;
  }
  
  .lang-toggle {
    display: inline-flex;
    border: 1.5px solid var(--gold-dark);
    border-radius: 999px;
    overflow: hidden;
    background: rgba(27, 42, 61, 0.5);
    backdrop-filter: blur(4px);
  }
  .lang-toggle button {
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.15em;
    background: transparent;
    border: none;
    color: var(--papyrus-soft);
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .lang-toggle button.active {
    background: var(--gold);
    color: var(--ink);
  }
  .lang-toggle button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
    position: relative;
    z-index: 1;
  }

  .page-header {
    animation: fadein 1s ease 0.1s backwards;
  }

  h1 { font-family: 'Cinzel', 'Gentium Plus', serif; font-size: clamp(36px, 5vw, 56px); color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .subtitle { font-family: 'Cinzel', 'Gentium Plus', serif; color: var(--terracotta-lt); letter-spacing: 0.3em; font-size: 14px; margin-bottom: 24px; text-transform: uppercase; }
  .about-beta-note { font-size: 0.82em; color: var(--terracotta-lt); font-style: italic; margin-top: 16px; opacity: 0.8; }
  .modal-cite { margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(201,166,70,0.2); font-size: 0.86em; color: var(--papyrus-soft); line-height: 1.55; }
  .modal-cite .modal-subtitle { margin-top: 0; }
  .modal-cite .cite-ref { font-style: normal; }
  .modal-cite a { color: var(--gold-light); word-break: break-word; }
  .modal-license { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--gold-dark); text-align: center; }
  .modal-license a { opacity: 0.65; transition: opacity 0.2s; display: inline-block; }
  .modal-license a:hover { opacity: 1; }
  .footer-license-badge { display: block; margin-top: 10px; opacity: 0.65; transition: opacity 0.2s; }
  .footer-license-badge:hover { opacity: 1; }

  /* Epígrafe do Ptahhotep */
  .epigraph {
    max-width: 620px;
    margin: 0 auto 56px;
    padding: 22px 28px;
    position: relative;
    animation: fadein 1s ease 0.25s backwards;
  }
  .epigraph::before, .epigraph::after {
    content: '';
    display: block;
    width: 60%;
    height: 1px;
    margin: 0 auto;
    background: linear-gradient(90deg, transparent, rgba(201,166,70,0.5), transparent);
  }
  .epigraph::before { margin-bottom: 18px; }
  .epigraph::after { margin-top: 18px; }
  .epigraph-label {
    color: var(--gold);
    font-size: 20px;
    margin-bottom: 14px;
    line-height: 1;
  }
  .epigraph-label .glyphs {
    font-family: 'Noto Sans Egyptian Hieroglyphs', sans-serif;
    letter-spacing: 0.05em;
  }
  .epigraph-label .label-romanized {
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-left: 10px;
    opacity: 0.75;
    vertical-align: middle;
    color: var(--papyrus-soft);
  }
  .epigraph blockquote {
    border: none;
    padding: 0;
    margin: 0;
  }
  .quote-translit {
    font-family: 'EB Garamond', 'Gentium Plus', 'Noto Serif', serif;
    font-style: italic;
    color: var(--gold-light);
    font-size: 16px;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
    line-height: 1.5;
    opacity: 0.9;
  }
  .quote-translation {
    font-family: 'EB Garamond', 'Gentium Plus', 'Noto Serif', serif;
    color: var(--papyrus);
    font-size: 19px;
    line-height: 1.6;
    font-style: italic;
  }
  .epigraph-source {
    display: block;
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--papyrus-dim);
    margin-top: 16px;
  }

  .library-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  
  .scroll-card {
    background: linear-gradient(180deg, rgba(36,52,73,0.7), rgba(27,42,61,0.9));
    border: 1px solid var(--gold-dark);
    border-radius: 12px;
    padding: 30px;
    cursor: pointer;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    text-align: left;
    text-decoration: none;
    display: block;
    backdrop-filter: blur(4px);
    animation: fadein-card 0.7s ease backwards;
  }
  .scroll-card:nth-child(1) { animation-delay: 0.35s; }
  .scroll-card:nth-child(2) { animation-delay: 0.55s; }
  .scroll-card:nth-child(3) { animation-delay: 0.75s; }
  .scroll-card:nth-child(4) { animation-delay: 0.95s; }

  @keyframes fadein-card {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .scroll-card:hover {
    transform: translateY(-4px);
    border-color: var(--gold);
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  }
  .scroll-card:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 4px;
    border-color: var(--gold);
  }
  .scroll-card.locked {
    background: rgba(27,42,61,0.5);
    border-color: rgba(154,139,109,0.3);
    opacity: 0.6;
    cursor: not-allowed;
    pointer-events: none;
  }
  .scroll-card.locked:hover {
    transform: none;
    box-shadow: none;
    border-color: rgba(154,139,109,0.3);
  }
  .scroll-card.more-soon {
    background: transparent;
    border: 1px dashed rgba(201,166,70,0.35);
    cursor: default;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 180px;
  }
  .scroll-card.more-soon:hover {
    transform: none;
    box-shadow: none;
    border-color: rgba(201,166,70,0.35);
  }
  .scroll-card.more-soon .more-glyph {
    font-size: 40px;
    opacity: 0.7;
    margin-bottom: 12px;
  }
  .scroll-card.more-soon .card-title {
    color: var(--gold);
    font-size: 17px;
  }
  .scroll-card.more-soon .card-desc {
    color: var(--papyrus-dim);
  }

  .status-tag {
    position: absolute;
    top: 16px;
    right: 16px;
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
  }
  .tag-ready { background: rgba(201,166,70,0.15); color: var(--gold); border: 1px solid rgba(201,166,70,0.3); }
  .tag-locked { background: rgba(217,122,92,0.1); color: var(--terracotta-lt); border: 1px solid rgba(217,122,92,0.2); }

  .card-glyph { font-family: 'Noto Sans Egyptian Hieroglyphs', sans-serif; font-size: 48px; color: var(--gold); margin-bottom: 16px; line-height: 1; }
  .card-title { font-family: 'Cinzel', 'Gentium Plus', serif; font-size: 20px; font-weight: 700; color: var(--papyrus); margin-bottom: 10px; }
  .card-desc { font-size: 15px; color: var(--papyrus-soft); line-height: 1.5; }

  footer {
    margin-top: 80px;
    padding-top: 20px;
    border-top: 1px solid rgba(201, 166, 70, 0.2);
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--papyrus-dim);
    line-height: 1.6;
    white-space: pre-line;
  }

  /* Logos institucionais (plaquinha clara, legível em ambos os temas) */
  .inst-logos {
    margin: 22px auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .inst-logos-label {
    font-family: 'Cinzel', 'Gentium Plus', serif;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--papyrus-dim);
    opacity: 0.75;
  }
  .inst-logos-plaque {
    display: inline-flex;
    align-items: center;
    gap: 26px;
    padding: 12px 22px;
    background: #f4ecde;
    border: 1px solid rgba(201, 166, 70, 0.35);
    border-radius: 10px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
  }
  .inst-logos-plaque img {
    display: block;
    width: auto;
    opacity: 0.95;
    transition: opacity 0.2s;
  }
  .inst-logos-plaque img.logo-ppgarq { height: 38px; }
  .inst-logos-plaque img.logo-mn { height: 30px; }
  .inst-logos-plaque a:hover img { opacity: 1; }
  .inst-logos-divider {
    width: 1px;
    align-self: stretch;
    background: rgba(201, 166, 70, 0.4);
  }
  /* No modal, um pouco menores */
  .modal-inst-logos { margin: 16px 0 0; }
  .modal-inst-logos .inst-logos-plaque { gap: 20px; padding: 10px 18px; }
  .modal-inst-logos .inst-logos-plaque img.logo-ppgarq { height: 32px; }
  .modal-inst-logos .inst-logos-plaque img.logo-mn { height: 26px; }
  @media (max-width: 480px) {
    .inst-logos-plaque { gap: 18px; padding: 10px 16px; }
    .inst-logos-plaque img.logo-ppgarq { height: 32px; }
    .inst-logos-plaque img.logo-mn { height: 25px; }
  }

  /* Modal "Sobre o Projeto" */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(8, 14, 22, 0.8);
    backdrop-filter: blur(5px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    visibility: hidden; /* some também para leitores de tela e Tab */
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .modal-backdrop.show {
    opacity: 1;
    pointer-events: auto;
    visibility: visible;
  }
  .modal-panel {
    background: linear-gradient(180deg, #253549 0%, #1b2a3d 100%);
    border: 1.5px solid var(--gold-dark);
    border-radius: 14px;
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 36px 40px 32px;
    position: relative;
    text-align: left;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transform: translateY(16px) scale(0.98);
    transition: transform 0.3s ease;
  }
  .modal-backdrop.show .modal-panel {
    transform: translateY(0) scale(1);
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--gold-dark);
    background: rgba(27, 42, 61, 0.7);
    color: var(--papyrus-soft);
    cursor: pointer;
    font-size: 22px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease, border-color 0.2s ease;
    padding: 0 0 3px 0;
  }
  .modal-close:hover { color: var(--gold-light); border-color: var(--gold); }
  .modal-close:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .modal-title-glyph {
    font-family: 'Noto Sans Egyptian Hieroglyphs', sans-serif;
    color: var(--gold);
    font-size: 36px;
    line-height: 1;
    margin-bottom: 6px;
    text-shadow: 0 0 18px rgba(201,166,70,0.25);
  }
  .modal-title {
    font-family: 'Cinzel', 'Gentium Plus', serif;
    color: var(--gold);
    font-size: 22px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(201,166,70,0.25);
  }
  .modal-body p {
    color: var(--papyrus);
    font-size: 16px;
    line-height: 1.65;
    margin-bottom: 14px;
  }
  .modal-body .meaning-glyph {

  // Monta os cards da biblioteca a partir do catálogo (uma vez, no load;
  // os textos são atualizados por render() para preservar a animação).
  function buildLibrary() {
    const grid = document.getElementById('libraryGrid');
    let html = '';
    for (const s of MUSAEUM_CATALOG) {
      if (s.available) {
        html += `
      <a href="${s.href}" class="scroll-card" id="card-${s.storyId}">
        <span class="status-tag tag-ready" data-t="tagOpen"></span>
        <div class="card-glyph" aria-hidden="true">${s.cardGlyph}</div>
        <div class="card-title"></div>
        <div class="card-desc"></div>
      </a>`;
      } else {
        html += `
      <div class="scroll-card locked" id="card-${s.storyId}" aria-disabled="true">
        <span class="status-tag tag-locked" data-t="tagLocked"></span>
        <div class="card-glyph" aria-hidden="true">${s.cardGlyph}</div>
        <div class="card-title"></div>
        <div class="card-desc"></div>
      </div>`;
      }
    }
    html += `
      <div class="scroll-card more-soon" aria-hidden="true">
        <div class="card-glyph more-glyph" aria-hidden="true">𓏼</div>
        <div class="card-title" data-t="tMore"></div>
        <div class="card-desc" data-t="dMore"></div>
      </div>`;
    grid.innerHTML = html;
  }

  function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('musaeum-lang', lang);
    const t = i18n[lang];
    document.documentElement.lang = t.docLang;
    document.title = t.pageTitle;

    document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-pt').setAttribute('aria-pressed', lang === 'pt');
    document.getElementById('btn-en').setAttribute('aria-pressed', lang === 'en');

    render();
  }

  function render() {
    const t = i18n[currentLang];

    document.getElementById('btnAboutLabel').textContent = t.aboutBtn;
    document.getElementById('btnAbout').setAttribute('aria-label', t.aboutBtn);
    document.getElementById('btnCloseAbout').setAttribute('aria-label', t.aboutClose);

    document.getElementById('subtitle').textContent = t.subtitle;

    document.getElementById('epigraphLabel').textContent = t.epigraphLabel;
    document.getElementById('epigraphQuote').textContent = t.epigraphQuote;
    document.getElementById('epigraphSource').textContent = t.epigraphSource;

    // Atualiza apenas os textos dos cards (preserva a animação em cascata)
    document.querySelectorAll('[data-t]').forEach(el => {
      const key = el.getAttribute('data-t');
      if (t[key] !== undefined) el.textContent = t[key];
    });

    // Títulos, descrições e aria-labels dos cards vêm do catálogo
    for (const s of MUSAEUM_CATALOG) {
      const card = document.getElementById('card-' + s.storyId);
      if (!card) continue;
      const title = currentLang === 'pt' ? s.titlePt : s.titleEn;
      const desc  = currentLang === 'pt' ? s.descPt  : s.descEn;
      card.querySelector('.card-title').textContent = title;
      card.querySelector('.card-desc').textContent  = desc;
      card.setAttribute('aria-label', `${title}, ${s.available ? t.tagOpen : t.tagLocked}`);
    }

    document.getElementById('footerContent').innerText = t.footer;
    document.getElementById('footerPrivacy').innerText = t.footerPrivacy;
    document.getElementById('footerInstSupport').innerText = t.instSupport;
    renderCollection();
    renderCertificateSection();

    // Corpo do modal Sobre
    document.getElementById('aboutTitle').textContent = t.aboutTitle;
    document.getElementById('aboutBody').innerHTML = `
      <p>${t.aboutIntro}</p>
      <p>${t.aboutMiddle}</p>
      <p>${t.aboutGoal}</p>
      <p class="about-beta-note">${t.aboutBetaNote}</p>
      <div class="modal-subtitle">${t.aboutBiblioTitle}</div>
      <ul class="modal-biblio">
        ${t.aboutBiblio.map(item => `<li>${item}</li>`).join('')}
      </ul>
      <div class="modal-credit">${t.aboutCredit.replace('\n', '<br>')}</div>
      <div class="modal-cite">
        <div class="modal-subtitle">${t.aboutCiteTitle}</div>
        <p class="cite-ref">${t.aboutCiteText}</p>
      </div>
      <div class="inst-logos modal-inst-logos">
        <span class="inst-logos-label">${t.instSupport}</span>
        <div class="inst-logos-plaque">
          <img class="logo-ppgarq" src="assets/images/ppgarq.png" alt="PPGArq · Museu Nacional / UFRJ">
          <span class="inst-logos-divider" aria-hidden="true"></span>
          <img class="logo-mn" src="assets/images/museu-nacional.png" alt="Museu Nacional / UFRJ">
        </div>
      </div>
      <div class="modal-license">
        <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt_BR" target="_blank" rel="noopener" aria-label="Licenciado sob Creative Commons BY-NC-SA 4.0">
          <img src="https://licensebuttons.net/l/by-nc-sa/4.0/88x31.png" alt="CC BY-NC-SA 4.0" width="88" height="31">
        </a>
      </div>
    `;
  }

  // Enquanto um modal está aberto, o resto da página fica inert:
  // Tab e leitores de tela não escapam para o conteúdo de fundo.
  function setPageInert(on) {
    const main = document.querySelector('main.container');
    if (main) main.inert = on;
  }

  function openAbout() {
    const m = document.getElementById('aboutModal');
    m.classList.add('show');
    aboutOpen = true;
    document.body.style.overflow = 'hidden';
    setPageInert(true);
    setTimeout(() => document.getElementById('btnCloseAbout').focus(), 60);
  }
  function closeAbout() {
    document.getElementById('aboutModal').classList.remove('show');
    aboutOpen = false;
    document.body.style.overflow = '';
    setPageInert(false);
    document.getElementById('btnAbout').focus();
  }
  function closeAboutOnBackdrop(e) {
    if (e.target.id === 'aboutModal') closeAbout();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (document.getElementById('glyphModal').classList.contains('show')) closeGlyphCard();
      else if (aboutOpen) closeAbout();
    }
  });

  // ===== NOME DO JOGADOR =====
  function savePlayerName(name) {
    localStorage.setItem('musaeum-player', JSON.stringify({ name }));
  }

  function openNameModal() {
    const t = i18n[currentLang];
    document.getElementById('nameModalTitle').textContent = t.nameModalTitle;
    document.getElementById('nameModalSub').textContent   = t.nameModalSub;
    document.getElementById('nameModalBtn').textContent   = t.nameModalBtn;
    document.getElementById('nameModalSkip').textContent  = t.nameModalSkip;
    const input = document.getElementById('nameInput');
    input.placeholder = t.nameModalPlaceholder;
    input.value = getPlayerName() || '';
    document.getElementById('researchConsentText').textContent = t.consentLabel;
    document.getElementById('researchConsent').checked =
      localStorage.getItem('musaeum-research-consent') === 'sim';
    document.getElementById('nameModal').classList.add('show');
    setPageInert(true);
    setTimeout(() => input.focus(), 60);
  }

  // ===== SELETOR DE IDIOMA (primeira pop-up) =====
  function showLangModal() {
    document.getElementById('langModal').classList.add('show');
    setPageInert(true);
    setTimeout(() => {
      const first = document.querySelector('#langModal .lang-choice');
      if (first) first.focus();
    }, 60);
  }

  function chooseLang(lang) {
    setLang(lang); // persiste em musaeum-lang
    document.getElementById('langModal').classList.remove('show');
    setTimeout(openNameModal, 340); // boas-vindas já no idioma escolhido
  }

  function closeNameModal() {
    document.getElementById('nameModal').classList.remove('show');
    setPageInert(false);
  }

  function recordConsent() {
    const checked = document.getElementById('researchConsent').checked;
    localStorage.setItem('musaeum-research-consent', checked ? 'sim' : 'não');
  }

  function saveName() {
    const name = document.getElementById('nameInput').value.trim();
    if (name) savePlayerName(name);
    recordConsent();
    closeNameModal();
    renderCollection();
    maybeOfferTour();
  }

  function skipName() {
    recordConsent();
    closeNameModal();
    maybeOfferTour();
  }

  // ===== TOUR GUIADO =====
  let _welcomeFirstRun = false;

  function maybeOfferTour() {
    if (!_welcomeFirstRun) return;
    _welcomeFirstRun = false;
    setTimeout(showTourOffer, 360); // depois do fade do modal de boas-vindas
  }

  function showTourOffer() {
    const t = i18n[currentLang];
    document.getElementById('tourOfferTitle').textContent = t.tourOfferTitle;
    document.getElementById('tourOfferSub').textContent   = t.tourOfferSub;
    document.getElementById('tourOfferYes').textContent   = t.tourOfferYes;
    document.getElementById('tourOfferNo').textContent    = t.tourOfferNo;
    document.getElementById('tourOfferModal').classList.add('show');
    setPageInert(true);
    setTimeout(() => document.getElementById('tourOfferYes').focus(), 60);
  }

  function closeTourOffer() {
    document.getElementById('tourOfferModal').classList.remove('show');
    setPageInert(false);
  }

  function acceptTourOffer() {
    closeTourOffer();
    setTimeout(startHomeTour, 340);
  }

  function declineTourOffer() {
    closeTourOffer();
  }

  function startHomeTour() {
    if (window.Tour && Tour.isActive()) return;
    const t = i18n[currentLang];
    const s = t.tourSteps;
    const selectors = ['.library-grid .scroll-card', '#collectionSection', '#certSection', '#btnAbout'];
    const steps = selectors.map((sel, i) => ({ selector: sel, title: s[i].title, body: s[i].body }));
    if (window.Tour) {
      Tour.start(steps, {
        labels: { skip: t.tourSkip, prev: t.tourPrev, next: t.tourNext, done: t.tourDone }
      });
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeNameModal(); closeTourOffer(); }
    // Enter confirma só quando o foco está no campo de nome; nos botões
    // ("Entrar sem nome" etc.) o Enter aciona o próprio botão focado.
    if (e.key === 'Enter' &&
        document.getElementById('nameModal').classList.contains('show') &&
        document.activeElement === document.getElementById('nameInput')) {
      saveName();
    }
  });

  // ===== COLEÇÃO =====
  function openGlyphCard(storyId, idx) {
    const story = catalogGet(storyId);
    if (!story || !story.codex) return;
    const g    = story.codex[idx];
    const lang = currentLang;
    const name    = lang === 'pt' ? g.namePt    : g.nameEn;
    const meaning = lang === 'pt' ? g.meaningPt : g.meaningEn;
    const note    = lang === 'pt' ? g.notePt    : g.noteEn;
    const chapterLabel = g.chapter === -1
      ? (lang === 'pt' ? 'Introdução' : 'Introduction')
      : `${lang === 'pt' ? 'Capítulo' : 'Chapter'} ${g.chapter + 1}`;
    const lMeaning  = lang === 'pt' ? 'Significado'   : 'Meaning';
    const lAppears  = lang === 'pt' ? 'Descoberto em' : 'Discovered in';
    const lNote     = lang === 'pt' ? 'Nota'          : 'Note';

    document.getElementById('glyphModalBody').innerHTML = `
      <div class="glyph-sheet">
        <div class="sheet-big" aria-hidden="true">${g.glyph}</div>
        <div class="sheet-translit">${g.translit}</div>
        <div class="sheet-name" id="glyphModalTitle">${name}</div>
        <div class="sheet-rows">
          <div class="sheet-row">
            <div class="row-label">${lMeaning}</div>
            <div class="row-value">${meaning}</div>
          </div>
          <div class="sheet-row">
            <div class="row-label">${lAppears}</div>
            <div class="row-value">${chapterLabel}</div>
          </div>
          <div class="sheet-row">
            <div class="row-label">${lNote}</div>
            <div class="row-value">${note}</div>
          </div>
        </div>
      </div>`;

    const modal = document.getElementById('glyphModal');
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
    setPageInert(true);
    setTimeout(() => document.getElementById('glyphModalClose').focus(), 60);
  }

  function closeGlyphCard() {
    document.getElementById('glyphModal').classList.remove('show');
    document.body.style.overflow = '';
    setPageInert(false);
  }

  function closeGlyphCardOnBackdrop(e) {
    if (e.target.id === 'glyphModal') closeGlyphCard();
  }

  function toggleCollection() {
    const section = document.getElementById('collectionSection');
    const header  = document.getElementById('collectionHeader');
    const isOpen  = section.classList.toggle('open');
    header.setAttribute('aria-expanded', isOpen);
  }

  function renderCollection() {
    const t = i18n[currentLang];
    const name = getPlayerName();

    const headingEl = document.getElementById('collectionHeading');
    if (name) {
      headingEl.innerHTML = `${t.collectionTitle} ${t.collectionOf} <span class="player-name-val">${escapeHtml(name)}</span>`;
    } else {
      headingEl.textContent = t.collectionTitle;
    }

    // Histórias que entram na Coleção: têm tesouros e estão publicadas
    // (ou guardam progresso de quem já jogou).
    const collectible = MUSAEUM_CATALOG.filter(s =>
      s.items && (s.available || storeGet(s.storyId)));

    // badge de resumo (X / total)
    let earnedCount = 0, totalCount = 0;
    for (const game of collectible) {
      totalCount += game.items.length;
      const save = storeGet(game.storyId);
      if (save) {
        const collected = save.collected || [];
        earnedCount += game.items.filter((_, i) => collected[i] === true).length;
      }
    }
    const summaryEl = document.getElementById('collectionSummary');
    if (summaryEl) summaryEl.textContent = `${earnedCount} / ${totalCount}`;

    const playerEl = document.getElementById('collectionPlayer');
    if (name) {
      playerEl.innerHTML = `<button class="edit-name-btn" onclick="openNameModal()" aria-label="${t.editNameLabel}" title="${t.editNameLabel}">✎</button>`;
    } else {
      playerEl.innerHTML = `<button class="edit-name-btn" onclick="openNameModal()" aria-label="${t.addNameLabel}" title="${t.addNameLabel}" style="opacity:0.45; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; font-family:'Cinzel',serif; text-decoration:underline;">${t.addNameLabel}</button>`;
    }

    const content = document.getElementById('collectionContent');
    let html = '';
    let anyData = false;

    // Tesouros por história
    for (const game of collectible) {
      const save = storeGet(game.storyId);
      if (!save) continue;
      anyData = true;
      const collected = save.collected || [];
      const gameTitle = currentLang === 'pt' ? game.titlePt : game.titleEn;
      html += `<div style="margin-bottom:24px;">
        <div class="collection-game-name">${gameTitle}</div>
        <div class="collection-grid">`;
      for (let i = 0; i < game.items.length; i++) {
        const item  = game.items[i];
        const earned = collected[i] === true;
        const label  = currentLang === 'pt' ? item.pt : item.en;
        html += `<div class="col-item ${earned ? 'earned' : 'locked'}" title="${earned ? escapeHtml(label) : '?'}">
          <div class="col-item-icon" aria-hidden="true">${earned ? item.icon : '·'}</div>
          <div class="col-item-label">${earned ? escapeHtml(label) : '?'}</div>
        </div>`;
      }
      html += `</div></div>`;
    }

    // Códex de hieróglifos por história
    const codexStories = MUSAEUM_CATALOG.filter(s => s.codex && storeGet(s.storyId));
    for (const story of codexStories) {
      anyData = true;
      const save = storeGet(story.storyId);
      const discovered = new Set(save?.discoveredGlyphs ?? []);
      const storyTitle = currentLang === 'pt' ? story.titlePt : story.titleEn;
      const heading = codexStories.length > 1
        ? `${t.codexSectionTitle} · ${storyTitle}`
        : t.codexSectionTitle;
      html += `<div style="margin-bottom:8px;">
        <div class="collection-game-name">${heading}</div>
        <div class="collection-grid">`;
      for (let i = 0; i < story.codex.length; i++) {
        const g     = story.codex[i];
        const found = discovered.has(i);
        const label = currentLang === 'pt' ? g.namePt : g.nameEn;
        if (found) {
          html += `<div class="col-item earned" onclick="openGlyphCard('${story.storyId}', ${i})" title="${escapeHtml(label)}">
            <div class="col-item-icon is-glyph" aria-hidden="true">${g.glyph}</div>
            <div class="col-item-label">${escapeHtml(label)}</div>
          </div>`;
        } else {
          html += `<div class="col-item locked">
            <div class="col-item-icon is-glyph" aria-hidden="true">?</div>
            <div class="col-item-label">?</div>
          </div>`;
        }
      }
      html += `</div></div>`;
    }

    if (!anyData) html = `<div class="collection-empty">${t.collectionEmpty}</div>`;
    content.innerHTML = html;
  }

  // ===== CERTIFICADO =====
  // Histórias publicadas (derivado do catálogo): todas precisam estar
  // concluídas para desbloquear o certificado.
  const AVAILABLE_STORIES = MUSAEUM_CATALOG.filter(s => s.available).map(s => s.storyId);

  function allStoriesComplete() {
    return AVAILABLE_STORIES.every(id => {
      const s = storeGet(id);
      return s && s.screen === 'final';
    });
  }

  function renderCertificateSection() {
    const section = document.getElementById('certSection');
    if (!section) return;
    const t = i18n[currentLang];
    const unlocked = allStoriesComplete();
    section.style.display = '';
    document.getElementById('certHeading').textContent = t.certSectionTitle;
    document.getElementById('certLockedWrap').style.display  = unlocked ? 'none' : '';
    document.getElementById('certLockedMsg').textContent     = t.certLocked;
    document.getElementById('certUnlockMsg').style.display   = unlocked ? '' : 'none';
    document.getElementById('certUnlockMsg').textContent     = t.certUnlock;
    document.getElementById('certOpenBtnWrap').style.display = unlocked ? '' : 'none';
    document.getElementById('certOpenBtn').textContent       = t.certOpenBtn;
    document.getElementById('certDownloadBtn').textContent   = t.certDownload;
    document.getElementById('certCloseBtn').textContent      = t.certClose;
  }

  function showCertificate() {
    document.getElementById('certPreview').style.display = '';
    document.getElementById('certOpenBtnWrap').style.display = 'none';
    document.fonts.ready.then(() => drawCertificate(currentLang));
  }

  function hideCertificate() {
    document.getElementById('certPreview').style.display = 'none';
    document.getElementById('certOpenBtnWrap').style.display = '';
  }

  function downloadCertificate() {
    document.fonts.ready.then(() => drawCertificate(currentLang).then(() => {
      const canvas = document.getElementById('certCanvas');
      const a = document.createElement('a');
      const raw = (getPlayerName() || 'musaeum').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');
      a.download = `musaeum-certificado-${raw || 'leitura'}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }));
  }

  function drawCertificate(lang) {
    const canvas = document.getElementById('certCanvas');
    const t = i18n[lang];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = 800, H = 560;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const GOLD = '#b5922e', GOLD_L = '#c8a642';
    const INK = '#1a1008', INK_SOFT = '#4a3820', INK_DIM = '#7a6040';

    function line(y, op=0.32) {
      const g = ctx.createLinearGradient(44, y, W - 44, y);
      g.addColorStop(0, 'transparent');
      g.addColorStop(0.12, `rgba(181,146,46,${op})`);
      g.addColorStop(0.88, `rgba(181,146,46,${op})`);
      g.addColorStop(1, 'transparent');
      ctx.strokeStyle = g; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(44, y); ctx.lineTo(W - 44, y); ctx.stroke();
    }

    function draw(ppImg, mnImg) {
      // Fundo marfim
      ctx.fillStyle = '#faf8f0';
      ctx.fillRect(0, 0, W, H);

      // Bordas
      ctx.strokeStyle = GOLD; ctx.lineWidth = 1.5;
      ctx.strokeRect(12, 12, W - 24, H - 24);
      ctx.strokeStyle = `rgba(181,146,46,0.35)`; ctx.lineWidth = 0.7;
      ctx.strokeRect(20, 20, W - 40, H - 40);

      // Losangos nos cantos
      [[12,12],[W-12,12],[12,H-12],[W-12,H-12]].forEach(([x,y]) => {
        ctx.fillStyle = GOLD;
        ctx.beginPath();
        ctx.moveTo(x, y-5); ctx.lineTo(x+5, y); ctx.lineTo(x, y+5); ctx.lineTo(x-5, y);
        ctx.closePath(); ctx.fill();
      });

      line(36);

      ctx.textAlign = 'center';

      // Hieroglifos ornamentais
      ctx.font = '17px "Noto Sans Egyptian Hieroglyphs", sans-serif';
      ctx.fillStyle = `rgba(181,146,46,0.42)`;
      ctx.fillText('𓊹   𓂀   𓇳', W/2, 60);

      // MUSAEUM
      ctx.font = 'bold 28px Cinzel, serif';
      ctx.fillStyle = GOLD;
      ctx.fillText('M U S Æ U M', W/2, 86);

      line(102, 0.16);

      // Titulo do certificado
      ctx.font = '700 9.5px Cinzel, serif';
      ctx.fillStyle = INK_DIM;
      ctx.fillText(t.certTitle.split('').join(' '), W/2, 118);

      line(132, 0.1);

      // Atesta-se que
      ctx.font = 'italic 16px "EB Garamond", Georgia, serif';
      ctx.fillStyle = INK_DIM;
      ctx.fillText(t.certAttest, W/2, 162);

      // Nome
      const playerName = getPlayerName() || (lang === 'pt' ? 'Leitor do Musæum' : 'Musæum Reader');
      ctx.font = 'bold 32px Cinzel, serif';
      ctx.fillStyle = INK;
      ctx.fillText(playerName, W/2, 200);

      line(218, 0.2);

      // concluiu com exito
      ctx.font = 'italic 15px "EB Garamond", Georgia, serif';
      ctx.fillStyle = INK_DIM;
      ctx.fillText(t.certCompleted, W/2, 246);

      // Historias
      const certStories = MUSAEUM_CATALOG.filter(s => s.available);
      let storyY = 282 - (certStories.length - 1) * 14;
      for (const s of certStories) {
        ctx.font = '20px "Noto Sans Egyptian Hieroglyphs", sans-serif';
        ctx.fillStyle = GOLD_L;
        ctx.textAlign = 'right';
        ctx.fillText(s.cardGlyph, W/2 - 12, storyY);
        ctx.font = '500 16px Cinzel, serif';
        ctx.fillStyle = INK_SOFT;
        ctx.textAlign = 'left';
        ctx.fillText(lang === 'pt' ? s.titlePt : s.titleEn, W/2 + 18, storyY);
        storyY += 28;
      }

      line(340);

      // Data centralizada
      const now = new Date();
      const dateStr = now.toLocaleDateString(lang === 'pt' ? 'pt-BR' : 'en-US', { day: '2-digit', month: 'long', year: 'numeric' });
      ctx.font = 'italic 12px "EB Garamond", Georgia, serif';
      ctx.fillStyle = INK_DIM;
      ctx.textAlign = 'center';
      ctx.fillText(dateStr, W/2, 364);

      // Logos institucionais centralizadas no rodape
      const logoH = 36;
      const ppW = ppImg && ppImg.naturalWidth ? logoH * (ppImg.naturalWidth / ppImg.naturalHeight) : 0;
      const mnW = mnImg && mnImg.naturalWidth ? logoH * (mnImg.naturalWidth / mnImg.naturalHeight) : 0;
      const gap = 28;
      const totalW = ppW + gap + mnW;
      const logoX = (W - totalW) / 2;
      const logoY = 386;
      if (ppImg && ppImg.naturalWidth) ctx.drawImage(ppImg, logoX, logoY, ppW, logoH);
      if (mnImg && mnImg.naturalWidth) ctx.drawImage(mnImg, logoX + ppW + gap, logoY, mnW, logoH);

      // Ornamento de rodape
      ctx.font = '13px "Noto Sans Egyptian Hieroglyphs", sans-serif';
      ctx.fillStyle = `rgba(181,146,46,0.09)`;
      ctx.textAlign = 'center';
      ctx.fillText('𓊹𓂀𓇳𓏞𓊛𓁹𓄿𓅓𓆑𓈋𓈖𓉐𓊛𓊴𓌀𓏃𓌛𓏞', W/2, 476);
    }

    return new Promise(resolve => {
      const ppImg = new Image();
      const mnImg = new Image();
      let pending = 2;
      function onDone() { if (--pending === 0) { draw(ppImg, mnImg); resolve(); } }
      ppImg.onload = ppImg.onerror = onDone;
      mnImg.onload = mnImg.onerror = onDone;
      ppImg.src = 'assets/images/ppgarq.png';
      mnImg.src = 'assets/images/museu-nacional.png';
    });
  }


  // Inicialização
  migrateOldSaves();
  initTheme();
  buildLibrary();
  const _savedLang = localStorage.getItem('musaeum-lang') || 'pt';
  setLang(_savedLang);
  if (window.Research) Research.init({ suppressModal: true });
  if (localStorage.getItem('musaeum-research-consent') === null) {
    _welcomeFirstRun = true;
    setTimeout(showLangModal, 500); // idioma → boas-vindas → tour
  }
</script>
</body>
</html>
