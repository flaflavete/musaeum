<body>

<p class="sr-only">Imagem de fundo: Fachada do templo de Horus em Edfu, Egito. Foto de Flavia Lima Corpas, outubro de 2025.</p>

<main class="container">

  <nav class="topbar" aria-label="Controles da página">
    <button class="about-btn" id="btnAbout" type="button" onclick="openAbout()" aria-haspopup="dialog">
      <span class="info-mark" aria-hidden="true">i</span>
      <span id="btnAboutLabel">Sobre</span>
    </button>
    <div class="lang-toggle" role="group" aria-label="Idioma / Language">
      <button class="active" id="btn-pt" type="button" onclick="setLang('pt')" aria-pressed="true">PT</button>
      <button id="btn-en" type="button" onclick="setLang('en')" aria-pressed="false">EN</button>
    </div>
    <button id="btnTheme" class="btn-theme" type="button" onclick="toggleTheme()" aria-label="Alternar tema claro/escuro" title="Tema claro/escuro">☀</button>
    <button id="btnTour" class="btn-theme" type="button" onclick="startHomeTour()" aria-label="Tutorial" title="Tutorial">?</button>
  </nav>

  <header class="page-header">
    <h1>Musæum</h1>
  </header>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Seções do Musæum">
    <button class="tab active" id="tab-inicio"  role="tab" aria-selected="true"  aria-controls="panel-inicio"  data-tab="inicio"  data-t="tabInicio"  type="button" onclick="showTab('inicio')"></button>
    <button class="tab"        id="tab-mapa"    role="tab" aria-selected="false" aria-controls="panel-mapa"    data-tab="mapa"    data-t="tabMapa"    type="button" tabindex="-1" onclick="showTab('mapa')"></button>
    <button class="tab"        id="tab-aprender" role="tab" aria-selected="false" aria-controls="panel-aprender" data-tab="aprender" data-t="tabAprender" type="button" tabindex="-1" onclick="showTab('aprender')"></button>
  </nav>

  <div class="tab-panel active" id="panel-inicio" role="tabpanel" aria-labelledby="tab-inicio">
    <section aria-labelledby="libraryHeading">
      <h2 id="libraryHeading" style="position:absolute;left:-9999px;">Biblioteca</h2>
      <!-- Cards gerados a partir de MUSAEUM_CATALOG (data/catalogo.js) por buildLibrary() -->
      <div class="library-grid" id="libraryGrid"></div>
    </section>

    <div class="library-invite" id="libraryInvite"></div>

    <section class="epigraph" aria-label="Epígrafe">
      <div class="epigraph-label">
        <span class="glyphs" aria-hidden="true">𓋴𓃀𓇼𓄿𓇋𓇋𓏏𓏛</span><span class="label-romanized">sbꜣyt · <span id="epigraphLabel"></span></span>
      </div>
      <blockquote>
        <p class="quote-translit" lang="egy" aria-label="Transliteração do egípcio antigo">dgꜣ mdt nfrt r wꜣḏ,<br>jw gm st m-ꜥ ḥmwt ḥr bnwt</p>
        <p class="quote-translation" id="epigraphQuote"></p>
      </blockquote>
      <cite class="epigraph-source" id="epigraphSource"></cite>
    </section>
  </div>

  <section class="geo-section tab-panel" id="panel-mapa" role="tabpanel" aria-labelledby="tab-mapa" hidden>
    <div class="panel-heading">
      <span class="collection-heading" id="geoHeading"></span>
      <span class="collection-summary" id="geoSummary"></span>
    </div>
    <div class="panel-body">
      <p class="geo-intro" id="geoIntro"></p>
      <div class="geo-map-wrap">
        <div class="geo-map">
          <!-- Carta antiga (fundo) + camada de marcadores (data/geografia.js) -->
          <div class="geo-stage">
            <img class="geo-basemap" id="geoBasemap" src="assets/images/mapa-egito-malte-brun-1837.jpg" alt="">
            <div class="geo-markers" id="geoMarkers"></div>
          </div>
          <p class="geo-credit" id="geoCredit"></p>
        </div>
        <aside class="geo-side">
          <div class="geo-panel" id="geoPanel" aria-live="polite"></div>
          <ul class="geo-legend" id="geoLegend"></ul>
        </aside>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="panel-aprender" role="tabpanel" aria-labelledby="tab-aprender" hidden>
    <div class="aprender-hub">
      <div class="aprender-progress">
        <div class="aprender-stat">
          <span class="aprender-num" id="aprenderStatDone">0</span>
          <span class="aprender-label" data-t="aprenderLicoesConcl"></span>
        </div>
        <div class="aprender-bar-wrap">
          <div class="aprender-bar-label"><span data-t="aprenderProgressoGeral"></span><span id="aprenderPct">0%</span></div>
          <div class="aprender-bar-bg"><div class="aprender-bar-fill" id="aprenderFill" style="width:0%"></div></div>
        </div>
      </div>
      <div class="aprender-section" data-t="aprenderLicoesTitle"></div>
      <div class="aprender-grid" id="aprenderGrid"></div>
      <div class="aprender-section" data-t="aprenderFerrTitle"></div>
      <div class="aprender-tools" id="aprenderTools"></div>

      <div class="cert-wrap" id="certWrap">
        <div class="cert-section-title" id="certSectionTitle"></div>
        <div class="cert-name-line" id="certNameLine"></div>
        <div class="cert-locked-wrap" id="certLockedWrap" style="display:none;">
          <span class="cert-lock-icon">𓂀</span>
          <p class="cert-locked-msg" id="certLockedMsg"></p>
        </div>
        <div id="certOpenBtnWrap" style="display:none;">
          <p class="cert-unlock-msg" id="certUnlockMsg"></p>
          <button class="cert-open-btn" id="certOpenBtn" onclick="showCertificate()"></button>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <span id="footerContent"></span>
    <span id="footerPrivacy" style="display:block; margin-top:10px; font-family: sans-serif; font-size:10px; letter-spacing:0.05em; opacity:0.55;"></span>
    <div class="inst-logos">
      <span class="inst-logos-label" id="footerInstSupport"></span>
      <div class="inst-logos-plaque">
        <img class="logo-ppgarq" src="assets/images/ppgarq.png" alt="PPGArq · Museu Nacional / UFRJ">
        <span class="inst-logos-divider" aria-hidden="true"></span>
        <img class="logo-mn" src="assets/images/museu-nacional.png" alt="Museu Nacional / UFRJ">
      </div>
    </div>
    <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt_BR" target="_blank" rel="noopener" class="footer-license-badge" aria-label="Licenciado sob Creative Commons BY-NC-SA 4.0">
      <img src="https://licensebuttons.net/l/by-nc-sa/4.0/88x31.png" alt="CC BY-NC-SA 4.0" width="88" height="31">
    </a>
  </footer>
</main>

<!-- Modal Certificado de Leitura -->
<div class="modal-backdrop" id="certModal" role="dialog" aria-modal="true" aria-labelledby="certModalTitle">
  <div class="modal-panel cert-modal-panel">
    <canvas id="certCanvas" width="800" height="560"></canvas>
    <div class="cert-btn-row">
      <button class="about-btn" id="certDownloadBtn" onclick="downloadCertificate()"></button>
      <button class="about-btn" id="certCloseBtn" onclick="hideCertificate()"></button>
    </div>
  </div>
</div>

<!-- Modal Seletor de Idioma -->
<div class="name-modal-backdrop" id="langModal" role="dialog" aria-modal="true" aria-labelledby="langModalTitle">
  <div class="name-modal-panel">
    <div class="name-modal-glyph" aria-hidden="true">𓂀</div>
    <h2 class="name-modal-title" id="langModalTitle">Musæum</h2>
    <p class="name-modal-sub">Escolha seu idioma<br><span style="opacity:0.7">Choose your language</span></p>
    <div class="lang-choice-row">
      <button class="lang-choice" type="button" onclick="chooseLang('pt')">
        <span class="lang-name">Português</span>
      </button>
      <button class="lang-choice" type="button" onclick="chooseLang('en')">
        <span class="lang-name">English</span>
      </button>
    </div>
  </div>
</div>

<!-- Modal Nome -->
<div class="name-modal-backdrop" id="nameModal" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
  <div class="name-modal-panel">
    <div class="name-modal-glyph" aria-hidden="true">𓂀</div>
    <h2 class="name-modal-title" id="nameModalTitle"></h2>
    <p class="name-modal-sub" id="nameModalSub"></p>
    <input type="text" class="name-input" id="nameInput" maxlength="32" autocomplete="off" />
    <label class="research-consent" for="researchConsent">
      <input type="checkbox" id="researchConsent" />
      <span class="research-consent-text" id="researchConsentText"></span>
    </label>
    <button class="name-modal-btn" id="nameModalBtn" onclick="saveName()"></button>
    <button class="name-modal-skip" id="nameModalSkip" onclick="skipName()"></button>
  </div>
</div>

<!-- Modal Oferta de Tour -->
<div class="name-modal-backdrop" id="tourOfferModal" role="dialog" aria-modal="true" aria-labelledby="tourOfferTitle">
  <div class="name-modal-panel">
    <div class="name-modal-glyph" aria-hidden="true">𓏞</div>
    <h2 class="name-modal-title" id="tourOfferTitle"></h2>
    <p class="name-modal-sub" id="tourOfferSub"></p>
    <button class="name-modal-btn" id="tourOfferYes" type="button" onclick="acceptTourOffer()"></button>
    <button class="name-modal-skip" id="tourOfferNo" type="button" onclick="declineTourOffer()"></button>
  </div>
</div>

<!-- Modal Ficha do Glifo -->
<div class="modal-backdrop" id="glyphModal" role="dialog" aria-modal="true" aria-labelledby="glyphModalTitle" onclick="closeGlyphCardOnBackdrop(event)">
  <div class="modal-panel" role="document">
    <button class="modal-close" id="glyphModalClose" type="button" onclick="closeGlyphCard()" aria-label="Fechar">×</button>
    <div id="glyphModalBody"></div>
  </div>
</div>

<!-- Modal Sobre o Projeto -->
<div class="modal-backdrop" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" onclick="closeAboutOnBackdrop(event)">
  <div class="modal-panel" role="document">
    <button class="modal-close" id="btnCloseAbout" type="button" onclick="closeAbout()" aria-label="Fechar">×</button>
    <div class="modal-title-glyph" aria-hidden="true"></div>
    <h2 class="modal-title" id="aboutTitle"></h2>
    <div class="modal-body" id="aboutBody"></div>
  </div>
</div>

<script src="script.js"></script>
<script src="data/catalogo.js"></script>
<script src="data/geografia.js"></script>
<script src="research.js"></script>
<script src="tour.js"></script>
<script src="home/i18n.js"></script>
<script src="home/biblioteca.js"></script>
<script src="home/modais.js"></script>
<script src="home/onboarding.js"></script>
<script src="home/abas.js"></script>
<script src="home/mapa.js"></script>
<script src="home/certificado.js"></script>
<script src="curso/licoes.js"></script>
<script src="home/aprender.js"></script>
<script src="home/main.js"></script>
</body>
</html>
