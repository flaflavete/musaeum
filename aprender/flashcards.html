<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards · Hieróglifos · Musæum</title>
<meta name="theme-color" content="#1b2a3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">
<link rel="stylesheet" href="aprender.css">
<style>
body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.licao-content {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 0;
  max-width: unset;
}

/* ── TOOLBAR ───────────────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  background: var(--ink-elevated);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.toolbar-label {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--papyrus-dim);
  text-transform: uppercase;
}
.deck-btn {
  padding: 5px 14px;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  background: var(--ink-raised);
  color: var(--papyrus-soft);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all .13s;
  letter-spacing: 0.05em;
}
.deck-btn:hover { border-color: var(--gold); color: var(--papyrus); }
.deck-btn.active { background: var(--gold); border-color: var(--gold); color: #1a1008; font-weight: 700; }

.mode-toggle {
  margin-left: auto;
  display: flex;
  background: var(--ink-raised);
  border: 1.5px solid var(--border);
  border-radius: 99px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  padding: 4px 14px;
  border-radius: 99px;
  border: none;
  background: transparent;
  color: var(--papyrus-dim);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all .13s;
}
.mode-btn.active {
  background: var(--ink-elevated);
  color: var(--gold);
  font-weight: 700;
}

/* ── MAIN AREA ──────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  gap: 20px;
  overflow: hidden;
}

/* ── PROGRESS ────────────────────────────── */
.session-progress {
  width: 100%;
  max-width: 520px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.session-bar-bg {
  flex: 1; height: 4px;
  background: var(--ink-raised);
  border-radius: 99px;
  overflow: hidden;
}
.session-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold));
  border-radius: 99px;
  transition: width .4s ease;
}
.session-stats {
  display: flex; gap: 14px;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.05em;
}
.stat-correct { color: var(--green); font-weight: 700; }
.stat-wrong   { color: var(--terracotta-lt); font-weight: 700; }
.stat-left    { color: var(--papyrus-dim); }

/* ── CARD ───────────────────────────────── */
.card-wrap {
  perspective: 1200px;
  width: 100%; max-width: 380px;
  height: 260px;
  cursor: pointer;
  flex-shrink: 0;
}
.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .45s cubic-bezier(.4,0,.2,1);
}
.card-wrap.flipped .card-inner { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0;
  background: var(--ink-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  padding: 24px;
}
.card-back {
  transform: rotateY(180deg);
  background: var(--ink-raised);
  border-color: var(--gold);
}
.card-hint {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  color: var(--papyrus-dim);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  position: absolute; top: 14px;
}
.card-glyph {
  font-family: 'Noto Sans Egyptian Hieroglyphs', sans-serif;
  font-size: 86px; line-height: 1;
  color: var(--papyrus);
}
.card-id {
  font-family: 'Cinzel', serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--gold);
}
.card-phon {
  font-family: 'EB Garamond', serif;
  font-size: 38px;
  color: var(--terracotta-lt);
  line-height: 1;
  font-style: italic;
}
.card-name {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  color: var(--papyrus-soft);
  text-align: center;
  line-height: 1.4;
  letter-spacing: 0.05em;
}
.card-tip {
  font-family: 'EB Garamond', serif;
  font-size: 13px;
  color: var(--papyrus-soft);
  text-align: center;
  line-height: 1.6;
  font-style: italic;
  max-width: 260px;
}

/* ── ANSWER BUTTONS ─────────────────────── */
.answer-row {
  display: flex; gap: 12px;
  width: 100%; max-width: 380px;
}
.answer-btn {
  flex: 1; padding: 12px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  font-family: 'Cinzel', serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all .15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.answer-btn:disabled { opacity: .3; pointer-events: none; }
.btn-wrong {
  background: rgba(217,122,92,.07);
  color: var(--terracotta-lt);
  border-color: rgba(217,122,92,.25);
}
.btn-wrong:hover { background: rgba(217,122,92,.16); border-color: var(--terracotta-lt); }
.btn-correct {
  background: rgba(76,175,122,.07);
  color: var(--green);
  border-color: rgba(76,175,122,.25);
}
.btn-correct:hover { background: rgba(76,175,122,.16); border-color: var(--green); }
.answer-row.hidden { opacity: 0; pointer-events: none; }

/* ── QUIZ MODE ──────────────────────────── */
.quiz-opts {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; width: 100%; max-width: 400px;
}
.qopt {
  background: var(--ink-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 10px;
  font-family: 'EB Garamond', serif;
  font-size: 22px; font-style: italic;
  color: var(--papyrus);
  cursor: pointer;
  text-align: center;
  transition: all .13s;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.qopt:hover:not(:disabled) { background: rgba(201,166,70,.08); border-color: var(--gold); }
.qopt.correct { background: rgba(76,175,122,.12); border-color: var(--green); color: var(--green); }
.qopt.wrong   { background: rgba(217,122,92,.08); border-color: var(--terracotta-lt); color: var(--terracotta-lt); }
.qopt:disabled { pointer-events: none; }
.qopt small {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--papyrus-dim);
  font-style: normal;
}

/* ── DONE SCREEN ────────────────────────── */
.done-screen {
  display: none; flex-direction: column;
  align-items: center; gap: 18px;
  text-align: center; max-width: 400px;
}
.done-screen.show { display: flex; }
.done-glyph {
  font-family: 'Noto Sans Egyptian Hieroglyphs', sans-serif;
  font-size: 64px; color: var(--gold);
}
.done-screen h2 {
  font-family: 'Cinzel', serif;
  font-size: 20px; font-weight: 700;
  color: var(--papyrus);
  letter-spacing: 0.06em;
}
.done-screen p  { font-family: 'EB Garamond', serif; font-size: 16px; color: var(--papyrus-soft); line-height: 1.6; }
.done-stats {
  display: flex; gap: 24px;
  background: var(--ink-elevated);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 28px;
}
.done-stat .num {
  display: block;
  font-family: 'Cinzel', serif;
  font-size: 30px; font-weight: 700;
  color: var(--gold);
}
.done-stat .lbl {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--papyrus-dim);
}
.done-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

@media (max-width: 480px) {
  .quiz-opts { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="licao-progress-bar" id="progressBar" style="width:0%"></div>

<header class="licao-header">
  <a class="licao-back" href="../index.html" onclick="history.length>1 ? (history.back(), event.preventDefault()) : null">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Musæum
  </a>
  <span class="licao-header-title">Flashcards · Hieróglifos</span>
</header>

<div class="toolbar">
  <span class="toolbar-label">Baralho</span>
  <button class="deck-btn active" onclick="setDeck('uniliterals', this)">24 unileteral</button>
  <button class="deck-btn" onclick="setDeck('all', this)">Todos os sinais</button>

  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('flash', this)">Flashcard</button>
    <button class="mode-btn" onclick="setMode('quiz', this)">Quiz</button>
  </div>
</div>

<div class="licao-content">
<div class="main" id="mainArea">

  <div class="session-progress" id="sessionProgress">
    <div class="session-bar-bg">
      <div class="session-bar-fill" id="sessionBar" style="width:0%"></div>
    </div>
    <div class="session-stats">
      <span class="stat-correct">✓ <span id="statC">0</span></span>
      <span class="stat-wrong">✗ <span id="statW">0</span></span>
      <span class="stat-left"><span id="statLeft">0</span> restantes</span>
    </div>
  </div>

  <!-- FLASHCARD MODE -->
  <div id="flashMode">
    <div class="card-wrap" id="cardWrap" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <span class="card-hint">clique para revelar</span>
          <span class="card-glyph" id="cardGlyph">𓄿</span>
          <span class="card-id" id="cardId">G1</span>
        </div>
        <div class="card-face card-back">
          <span class="card-hint">você sabia?</span>
          <span class="card-phon" id="cardPhon">ꜣ</span>
          <span class="card-name" id="cardName">Egyptian vulture</span>
          <span class="card-tip" id="cardTip"></span>
        </div>
      </div>
    </div>

    <div class="answer-row hidden" id="answerRow">
      <button class="answer-btn btn-wrong" onclick="answer(false)">✗ Errei</button>
      <button class="answer-btn btn-correct" onclick="answer(true)">✓ Acertei</button>
    </div>
  </div>

  <!-- QUIZ MODE -->
  <div id="quizMode" style="display:none; flex-direction:column; align-items:center; gap:16px; width:100%">
    <div class="card-wrap" style="cursor:default">
      <div class="card-inner">
        <div class="card-face">
          <span class="card-hint">qual é a transliteração?</span>
          <span class="card-glyph" id="qGlyph">𓄿</span>
          <span class="card-id" id="qId">G1</span>
        </div>
      </div>
    </div>
    <div class="quiz-opts" id="quizOpts"></div>
    <div style="width:100%; max-width:400px">
      <button class="btn btn-primary" style="width:100%;text-align:center" id="quizNextBtn" onclick="nextCard()" disabled>Próximo →</button>
    </div>
  </div>

  <!-- DONE -->
  <div class="done-screen" id="doneScreen">
    <span class="done-glyph">𓂋𓏤</span>
    <h2>Sessão concluída!</h2>
    <p>Você terminou o baralho. Continue praticando para fixar os sinais no longo prazo.</p>
    <div class="done-stats">
      <div class="done-stat"><span class="num" id="doneC">0</span><span class="lbl">acertos</span></div>
      <div class="done-stat"><span class="num" id="doneW">0</span><span class="lbl">erros</span></div>
      <div class="done-stat"><span class="num" id="donePct">0%</span><span class="lbl">aproveit.</span></div>
    </div>
    <div class="done-actions">
      <button class="btn" onclick="restartDeck()">↺ Recomeçar</button>
      <a class="btn btn-primary" href="../index.html">Voltar ao Musæum</a>
    </div>
  </div>

</div>
</div>

<script>
const UNILITERALS = [
  { id:'G1',  glyph:'𓄿', phon:'ꜣ', name:'Egyptian vulture',   tip:'O abutre egípcio. Som gutural aspirado. Muito comum em palavras divinas.' },
  { id:'M17', glyph:'𓇋', phon:'j',  name:'reed',               tip:'Um junco. Equivale ao Y ou I. Muito comum no início de palavras.' },
  { id:'M17', glyph:'𓇌', phon:'y',  name:'double reed',        tip:'Dois juncos. Reforça o som Y em sufixos e formas femininas.' },
  { id:'D36', glyph:'𓂝', phon:'ꜥ',  name:'forearm',            tip:'O braço aberto. Som faríngeo sem equivalente em português.' },
  { id:'G17', glyph:'𓅱', phon:'w',  name:'quail chick',        tip:'O pintinho de codorna. Som W, como em "uva". Muito frequente.' },
  { id:'D58', glyph:'𓃀', phon:'b',  name:'foot',               tip:'Um pé visto de lado. O som B.' },
  { id:'Q3',  glyph:'𓊪', phon:'p',  name:'stool',              tip:'Um banco visto de cima. O som P.' },
  { id:'I9',  glyph:'𓆑', phon:'f',  name:'horned viper',       tip:'A víbora cornuda. O som F.' },
  { id:'G17', glyph:'𓅓', phon:'m',  name:'owl',                tip:'A coruja. O som M. Olha sempre para a frente.' },
  { id:'N35', glyph:'𓈖', phon:'n',  name:'water ripple',       tip:'Ondas de água em ziguezague. O som N.' },
  { id:'D21', glyph:'𓂋', phon:'r',  name:'mouth',              tip:'Uma boca de frente. O som R. Extremamente comum.' },
  { id:'O4',  glyph:'𓉔', phon:'h',  name:'reed shelter',       tip:'Um abrigo de juncos. O H simples.' },
  { id:'V28', glyph:'𓎛', phon:'ḥ',  name:'twisted flax wick',  tip:'Pavio de linho torcido. H aspirado mais forte.' },
  { id:'Aa1', glyph:'𓐍', phon:'ḫ',  name:'placenta',           tip:'Som KH gutural, como o CH alemão em "Bach".' },
  { id:'F32', glyph:'𓄡', phon:'ẖ',  name:'belly of animal',    tip:'Barriga de animal. KH palatal, ligeiramente diferente do anterior.' },
  { id:'O34', glyph:'𓊃', phon:'z',  name:'bolt',               tip:'Uma tranca de porta. Som Z (ou S em alguns contextos).' },
  { id:'S29', glyph:'𓋴', phon:'s',  name:'folded cloth',       tip:'Tecido dobrado. O som S. Aparece em centenas de palavras.' },
  { id:'N37', glyph:'𓈙', phon:'š',  name:'garden pool',        tip:'Um lago visto de cima. O som SH, como em "show".' },
  { id:'N29', glyph:'𓈎', phon:'q',  name:'slope of hill',      tip:'Encosta de colina. O Q gutural, mais fundo que K.' },
  { id:'V31', glyph:'𓎡', phon:'k',  name:'basket with handle', tip:'Uma cesta com alça. O som K.' },
  { id:'W11', glyph:'𓎼', phon:'g',  name:'stand for jar',      tip:'Suporte para jarro. O som G como em "gato".' },
  { id:'X1',  glyph:'𓏏', phon:'t',  name:'bread loaf',         tip:'Um pão achatado. O som T. Também marca o feminino.' },
  { id:'V13', glyph:'𓍿', phon:'ṯ',  name:'tethering rope',     tip:'Uma corda. Som TJ palatal, como CH italiano em "ciao".' },
  { id:'D46', glyph:'𓂧', phon:'d',  name:'hand',               tip:'Uma mão. O som D.' },
  { id:'I10', glyph:'𓌀', phon:'ḏ',  name:'cobra',              tip:'Cobra com capuz. Som DJ, como em "djinn".' },
];

const BILITERALS = [
  { id:'D28', glyph:'𓐝', phon:'kꜣ', name:'pair of arms' },
  { id:'F34', glyph:'𓄤', phon:'nfr', name:'heart with trachea' },
  { id:'N5',  glyph:'𓇳', phon:'rꜥ', name:'sun disc' },
  { id:'S34', glyph:'𓋹', phon:'ꜥnḫ', name:'ankh' },
  { id:'G25', glyph:'𓅐', phon:'ꜣḫ', name:'crested ibis' },
  { id:'M22', glyph:'𓇷', phon:'wn', name:'rush' },
  { id:'D4',  glyph:'𓁹', phon:'jr', name:'eye' },
  { id:'G43', glyph:'𓅱', phon:'wꜣ', name:'quail chick (bil)' },
  { id:'N36', glyph:'𓈗', phon:'mr', name:'canal' },
  { id:'F35', glyph:'𓄥', phon:'ms', name:'three fox skins' },
  { id:'D54', glyph:'𓇼', phon:'jw', name:'walking legs' },
  { id:'O29', glyph:'𓋴𓄿', phon:'sꜣ', name:'folded cloth + vulture' },
  { id:'G1',  glyph:'𓄿𓏏', phon:'ꜣt', name:'vulture + bread' },
  { id:'N18', glyph:'𓏇', phon:'jw', name:'island' },
  { id:'V4',  glyph:'𓌀', phon:'wꜥ', name:'lasso' },
];

let deck = [], deckName = 'uniliterals', mode = 'flash';
let idx = 0, correct = 0, wrong = 0, flipped = false, quizAnswered = false;

function buildDeck(name) {
  let base = name === 'uniliterals' ? [...UNILITERALS] : [...UNILITERALS, ...BILITERALS];
  return base.sort(() => Math.random() - .5);
}

function setDeck(name, btn) {
  deckName = name;
  document.querySelectorAll('.deck-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  restartDeck();
}

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('flashMode').style.display = m === 'flash' ? 'contents' : 'none';
  document.getElementById('quizMode').style.display  = m === 'quiz'  ? 'flex'     : 'none';
  restartDeck();
}

function restartDeck() {
  deck = buildDeck(deckName);
  idx = 0; correct = 0; wrong = 0; flipped = false; quizAnswered = false;
  document.getElementById('doneScreen').classList.remove('show');
  document.getElementById('sessionProgress').style.display = '';
  document.getElementById(mode === 'flash' ? 'flashMode' : 'quizMode').style.display =
    mode === 'flash' ? 'contents' : 'flex';
  showCard();
}

function updateProgress() {
  const total = deck.length, done = idx;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('sessionBar').style.width = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('statC').textContent = correct;
  document.getElementById('statW').textContent = wrong;
  document.getElementById('statLeft').textContent = Math.max(0, total - done);
}

function showCard() {
  if (idx >= deck.length) { showDone(); return; }
  const s = deck[idx];
  updateProgress();

  if (mode === 'flash') {
    flipped = false;
    document.getElementById('cardWrap').classList.remove('flipped');
    document.getElementById('answerRow').classList.add('hidden');
    document.getElementById('cardGlyph').textContent = s.glyph;
    document.getElementById('cardId').textContent = s.id;
    document.getElementById('cardPhon').textContent = s.phon;
    document.getElementById('cardName').textContent = s.name;
    document.getElementById('cardTip').textContent = s.tip || '';
  } else {
    quizAnswered = false;
    document.getElementById('quizNextBtn').disabled = true;
    document.getElementById('qGlyph').textContent = s.glyph;
    document.getElementById('qId').textContent = s.id;

    const pool = UNILITERALS;
    const others = pool.filter(x => x.phon !== s.phon).sort(() => Math.random() - .5).slice(0, 3);
    const opts = [...others, s].sort(() => Math.random() - .5);
    document.getElementById('quizOpts').innerHTML = opts.map(o =>
      `<button class="qopt" onclick="checkQuiz(this,'${o.phon}')">
        <span>${o.phon}</span>
        <small>${o.name.split(' ').slice(0,2).join(' ')}</small>
      </button>`).join('');
  }
}

function flipCard() {
  if (mode !== 'flash') return;
  flipped = !flipped;
  document.getElementById('cardWrap').classList.toggle('flipped', flipped);
  document.getElementById('answerRow').classList.toggle('hidden', !flipped);
}

function answer(wasCorrect) {
  if (wasCorrect) correct++; else wrong++;
  idx++; showCard();
}

function checkQuiz(btn, chosen) {
  if (quizAnswered) return;
  quizAnswered = true;
  const s = deck[idx];
  document.querySelectorAll('.qopt').forEach(o => o.disabled = true);
  if (chosen === s.phon) { btn.classList.add('correct'); correct++; }
  else {
    btn.classList.add('wrong');
    document.querySelectorAll('.qopt').forEach(o => {
      if (o.querySelector('span').textContent === s.phon) o.classList.add('correct');
    });
    wrong++;
  }
  idx++; updateProgress();
  document.getElementById('quizNextBtn').disabled = false;
}

function nextCard() { showCard(); }

function showDone() {
  document.getElementById('flashMode').style.display = 'none';
  document.getElementById('quizMode').style.display = 'none';
  document.getElementById('sessionProgress').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
  const pct = deck.length ? Math.round((correct / deck.length) * 100) : 0;
  document.getElementById('doneC').textContent = correct;
  document.getElementById('doneW').textContent = wrong;
  document.getElementById('donePct').textContent = pct + '%';
  document.getElementById('doneScreen').classList.add('show');

  const p = JSON.parse(localStorage.getItem('musaeum-hieroglyphs') || '{}');
  p.cardsReviewed = (p.cardsReviewed || 0) + correct;
  localStorage.setItem('musaeum-hieroglyphs', JSON.stringify(p));
}

const params = new URLSearchParams(location.search);
if (params.get('mode') === 'quiz') {
  setMode('quiz', document.querySelectorAll('.mode-btn')[1]);
} else {
  restartDeck();
}

const t = localStorage.getItem('musaeum-theme');
if (t) document.documentElement.setAttribute('data-theme', t);
</script>

</body>
</html>
